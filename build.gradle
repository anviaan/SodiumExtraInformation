plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

def COMPATIBLE_VERSIONS = '1.20.6'

tasks.register("printEnv") {
    doLast {
        def envFile = new File(System.getenv("GITHUB_ENV"))
        envFile.append("MOD_VERSION=${project.mod_version}\n")
        envFile.append("RELEASE_NAME=${project.archives_base_name}-${project.mod_version}\n")
        envFile.append("GAME_VERSIONS=${COMPATIBLE_VERSIONS}\n")
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/sodiumextrainformation.accesswidener")
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url "https://maven.flashyreese.me/releases"
    }
    maven {
        url "https://repo.repsy.io/mvn/anvian/anvians-lib"
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")

    modImplementation "maven.modrinth:sodium:${project.sodium_version}"
    modImplementation "maven.modrinth:sodium-extra:${project.sodium_extra_version}"
    include(modImplementation("net.caffeinemc:CaffeineConfig:1.3.0+1.17"))

    modImplementation("net.anvian.anvianslib:anvianslib-fabric-1.20:${project.anvian_lib_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}